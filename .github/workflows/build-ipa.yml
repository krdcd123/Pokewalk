# Builds PokeWalk.ipa on a GitHub-hosted Mac. No Mac needed on your side.
# Run it from the "Actions" tab › "Build IPA" › "Run workflow", then download the artifact
# and install the .ipa from Windows with Sideloadly (see README).
name: Build IPA

on:
  workflow_dispatch:
    inputs:
      bundle_prefix:
        description: "Bundle ID prefix (something unique, e.g. com.yourname)"
        required: true
        default: "com.krdcd123"
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      BUNDLE_PREFIX: ${{ github.event.inputs.bundle_prefix || 'com.krdcd123' }}
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode on the runner
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          xcodebuild -showsdks | grep -E "iphoneos|watchos"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project PokeWalk.xcodeproj \
            -scheme PokeWalk \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -IDEBuildingContinueBuildingAfterErrors=YES \
            BUNDLE_ID_PREFIX="$BUNDLE_PREFIX" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || true
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" build.log | head -100 || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Package IPAs (with entitlements, ready to sign)
        run: bash ci/package-ipa.sh build/Build/Products/Release-iphoneos/PokeWalk.app "$BUNDLE_PREFIX"

      - name: Publish IPAs as direct downloads (Releases › latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create latest out/PokeWalk-SideStore.ipa out/PokeWalk-Basic.ipa out/PokeWalk-iPhone-only.ipa out/PokeWalk.ipa -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "PokéWalk (latest build)" --latest \
            --notes "Build ${{ github.run_number }} ($(echo $GITHUB_SHA | cut -c1-7)). SideStore/AltStore: try PokeWalk-SideStore.ipa first; if that will not install, PokeWalk-Basic.ipa (no special permissions). PokeWalk-iPhone-only.ipa adds the Live Activity + App Group; PokeWalk.ipa adds the Apple Watch app (Xcode only)."

      - uses: actions/upload-artifact@v4
        with:
          name: PokeWalk-ipa
          path: out/*.ipa
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log

      # Saves the errors to a `ci-logs` branch so they can be read without downloading artifacts.
      - name: Publish build errors to ci-logs branch
        if: always()
        run: |
          [ -f build.log ] || exit 0
          mkdir -p /tmp/ci && cd /tmp/ci
          grep -nE "error:|warning: unable|\*\* BUILD" "$GITHUB_WORKSPACE/build.log" | head -400 > errors.txt || true
          tail -200 "$GITHUB_WORKSPACE/build.log" > tail.txt
          echo "${{ job.status }} run ${{ github.run_number }} commit ${{ github.sha }}" > status.txt
          # Debug symbols, so crash reports from the app can be turned into file/line numbers.
          (cd "$GITHUB_WORKSPACE/build/Build/Products/Release-iphoneos" 2>/dev/null && zip -qr /tmp/ci/dSYMs.zip *.dSYM) || true
          git init -q && git checkout -q -b ci-logs
          git add . && git -c user.name=ci -c user.email=ci@localhost commit -qm "Build log for run ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs

# Signs PokéWalk with your paid Apple Developer account and uploads it to TestFlight.
# Install the TestFlight app on your iPhone; the Apple Watch app comes with it.
#
# Needs these repository secrets (GitHub › repo › Settings › Secrets and variables › Actions):
#   APPLE_TEAM_ID       – your 10-character Team ID (developer.apple.com › Account › Membership)
#   ASC_KEY_ID          – App Store Connect API key ID
#   ASC_ISSUER_ID       – App Store Connect API issuer ID
#   ASC_KEY_P8          – the contents of the AuthKey_XXXX.p8 file (open it in Notepad, copy everything)
# Until those exist this workflow does nothing.
name: TestFlight

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

# One upload at a time (each run makes and revokes its own certificate).
concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      BUNDLE_PREFIX: com.krdcd123
      HAS_KEYS: ${{ secrets.ASC_KEY_P8 != '' && secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - name: Skip until the App Store Connect key is added
        if: env.HAS_KEYS != 'true'
        run: echo "::notice::TestFlight secrets not set yet — skipping."

      - uses: actions/checkout@v4
        if: env.HAS_KEYS == 'true'

      - name: Use the newest Xcode
        if: env.HAS_KEYS == 'true'
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Set up the API key
        if: env.HAS_KEYS == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          echo "KEY_PATH=$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Signing certificate for this run
        if: env.HAS_KEYS == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          # Each runner is a fresh Mac, so a certificate made by an earlier run has no private key here.
          # Make a new one with a key we hold, and revoke it again at the end of the job.
          python3 -m pip install --quiet --user --break-system-packages pyjwt cryptography
          OSSL=/usr/bin/openssl
          $OSSL req -new -newkey rsa:2048 -nodes -keyout ci.key -out ci.csr -subj "/CN=PokeWalk CI/C=GB"
          CERT_ID=$(python3 scripts/asc.py create ci.csr ci.cer)
          echo "CERT_ID=$CERT_ID" >> "$GITHUB_ENV"
          $OSSL x509 -inform DER -in ci.cer -out ci.pem
          $OSSL pkcs12 -export -inkey ci.key -in ci.pem -out ci.p12 -passout pass:ci
          KC=$RUNNER_TEMP/build.keychain-db
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p ci "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KC"
          curl -fsSL -o wwdr.cer https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import wwdr.cer -k "$KC" -T /usr/bin/codesign || true
          security import ci.p12 -k "$KC" -P ci -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$KC" >/dev/null
          security find-identity -v -p codesigning "$KC"
          rm -f ci.key ci.p12

      - name: Generate project
        if: env.HAS_KEYS == 'true'
        run: brew install xcodegen && xcodegen generate

      - name: Archive (signed automatically with your account)
        if: env.HAS_KEYS == 'true'
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project PokeWalk.xcodeproj -scheme PokeWalk -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/PokeWalk.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic BUNDLE_ID_PREFIX="$BUNDLE_PREFIX" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" 2>&1 | tee archive.log | grep -E "error:|warning: .*(provision|sign)|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" archive.log

      - name: Upload to TestFlight
        if: env.HAS_KEYS == 'true'
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          set -o pipefail
          xcodebuild -exportArchive -archivePath build/PokeWalk.xcarchive -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee upload.log | tail -40

      - name: Revoke this run's certificate
        if: always() && env.CERT_ID != ''
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: python3 scripts/asc.py revoke "$CERT_ID" || true

      - name: Logs
        if: always() && env.HAS_KEYS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: |
            archive.log
            upload.log

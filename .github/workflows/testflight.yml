# Signs PokéWalk with your paid Apple Developer account and uploads it to TestFlight.
# Install the TestFlight app on your iPhone; the Apple Watch app comes with it.
#
# Needs these repository secrets (GitHub › repo › Settings › Secrets and variables › Actions):
#   APPLE_TEAM_ID       – your 10-character Team ID (developer.apple.com › Account › Membership)
#   ASC_KEY_ID          – App Store Connect API key ID
#   ASC_ISSUER_ID       – App Store Connect API issuer ID
#   ASC_KEY_P8          – the contents of the AuthKey_XXXX.p8 file (open it in Notepad, copy everything)
# Until those exist this workflow does nothing.
name: TestFlight

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      BUNDLE_PREFIX: com.krdcd123
      HAS_KEYS: ${{ secrets.ASC_KEY_P8 != '' && secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - name: Skip until the App Store Connect key is added
        if: env.HAS_KEYS != 'true'
        run: echo "::notice::TestFlight secrets not set yet — skipping."

      - uses: actions/checkout@v4
        if: env.HAS_KEYS == 'true'

      - name: Use the newest Xcode
        if: env.HAS_KEYS == 'true'
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Set up the API key
        if: env.HAS_KEYS == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          echo "KEY_PATH=$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Generate project
        if: env.HAS_KEYS == 'true'
        run: brew install xcodegen && xcodegen generate

      - name: Archive (signed automatically with your account)
        if: env.HAS_KEYS == 'true'
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project PokeWalk.xcodeproj -scheme PokeWalk -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/PokeWalk.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic BUNDLE_ID_PREFIX="$BUNDLE_PREFIX" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" 2>&1 | tee archive.log | grep -E "error:|warning: .*(provision|sign)|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" archive.log

      - name: Upload to TestFlight
        if: env.HAS_KEYS == 'true'
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          set -o pipefail
          xcodebuild -exportArchive -archivePath build/PokeWalk.xcarchive -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee upload.log | tail -40

      - name: Logs
        if: always() && env.HAS_KEYS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: |
            archive.log
            upload.log

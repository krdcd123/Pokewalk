# XcodeGen spec. You don't need a Mac: the GitHub Actions workflow in .github/workflows runs this for you.
# (On a Mac: `brew install xcodegen && xcodegen generate`.)
#
# Change BUNDLE_ID_PREFIX to something unique to you (e.g. com.yourname). The workflow can also override it.

name: PokeWalk

options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"

settings:
  base:
    BUNDLE_ID_PREFIX: com.krdcd123        # change here or in the workflow input
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_PREVIEWS: YES

targets:

  # ---------------------------------------------------------------- iPhone app
  PokeWalk:
    type: application
    platform: iOS
    sources:
      - path: iOS
      - path: Shared
      - path: Sprites               # optional: bundle your own sprites at build time
        type: folder
        buildPhase: resources
        optional: true
    dependencies:
      - target: PokeWalkWatch
      - target: PokeWalkLiveActivity
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: PokéWalk
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        AppGroupID: group.$(BUNDLE_ID_PREFIX).pokewalk
        NSHealthShareUsageDescription: PokéWalk reads your steps, walking distance, active calories and workouts (iPhone and Apple Watch) to level up your Pokémon and earn Poké Dollars.
        NSHealthUpdateUsageDescription: PokéWalk saves the workouts you record with it (time, calories, heart rate, distance) to Apple Health, like the Workout app.
        ITSAppUsesNonExemptEncryption: false
        NSMotionUsageDescription: PokéWalk counts your steps live so wild Pokémon can appear while you walk.
        NSLocationWhenInUseUsageDescription: PokéWalk draws where you walk on the map and records where you catch each Pokémon.
        NSLocationAlwaysAndWhenInUseUsageDescription: Lets PokéWalk record your walks and trigger encounters with your phone in your pocket.
        NSSupportsLiveActivities: true
        UIBackgroundModes: [location, fetch, audio, workout-processing]
        NSMicrophoneUsageDescription: PokéWalk can listen while you sleep and keep a few short clips of sleep talking. Nothing is uploaded.
        NSPhotoLibraryUsageDescription: PokéWalk shows photos you took on each day and at each place in your Journal. It only reads them.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: iOS/PokeWalk.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
        com.apple.security.application-groups:
          - group.$(BUNDLE_ID_PREFIX).pokewalk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).pokewalk
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # ---------------------------------------------------------------- Live Activity (Lock Screen + Watch Smart Stack)
  PokeWalkLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: LiveActivity
      - path: Shared
    info:
      path: LiveActivity/Info.plist
      properties:
        CFBundleDisplayName: PokéWalk Live
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        AppGroupID: group.$(BUNDLE_ID_PREFIX).pokewalk
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: LiveActivity/PokeWalkLiveActivity.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(BUNDLE_ID_PREFIX).pokewalk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).pokewalk.live
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

  # ---------------------------------------------------------------- Watch app
  # A companion app embedded inside the iPhone app (like Spotify's): installing PokéWalk on the
  # iPhone installs this on a paired Watch automatically when Watch › General › Automatic App Install is on.
  PokeWalkWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
      - path: Shared
    dependencies:
      - target: PokeWalkComplications
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: PokéWalk
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(BUNDLE_ID_PREFIX).pokewalk
        WKRunsIndependentlyOfCompanionApp: false
        AppGroupID: group.$(BUNDLE_ID_PREFIX).pokewalk
        NSHealthShareUsageDescription: PokéWalk reads your steps so your buddy's level stays live on your wrist.
        NSLocationWhenInUseUsageDescription: PokéWalk shows where you are on the watch map, with your buddy.
        NSMotionUsageDescription: PokéWalk notices when you're cycling so arm movement doesn't count as walking.
        WKBackgroundModes: [workout-processing]
        CFBundleURLTypes:
          - CFBundleURLName: com.krdcd123.pokewalk.watch
            CFBundleURLSchemes: [pokewalk]
        NSHealthUpdateUsageDescription: PokéWalk saves the workouts you record with it (time, calories, heart rate, distance) to Apple Health, like the Workout app.
    entitlements:
      path: Watch/PokeWalkWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
        com.apple.security.application-groups:
          - group.$(BUNDLE_ID_PREFIX).pokewalk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).pokewalk.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES

  # ---------------------------------------------------------------- Watch complications (WidgetKit)
  PokeWalkComplications:
    type: app-extension
    platform: watchOS
    sources:
      - path: Complications
      - path: Shared
    info:
      path: Complications/Info.plist
      properties:
        CFBundleDisplayName: PokéWalk Complications
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        AppGroupID: group.$(BUNDLE_ID_PREFIX).pokewalk
        NSHealthShareUsageDescription: PokéWalk reads your steps to update complications.
        NSHealthUpdateUsageDescription: PokéWalk saves the workouts you record with it (time, calories, heart rate, distance) to Apple Health, like the Workout app.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Complications/PokeWalkComplications.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.security.application-groups:
          - group.$(BUNDLE_ID_PREFIX).pokewalk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).pokewalk.watchkitapp.complications
        SKIP_INSTALL: YES
